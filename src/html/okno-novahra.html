<div class="modal" id="newmodal" hidden>
  <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="newtitle">
    <div class="modalhead">
      <h2 id="newtitle" data-i18n="nova.nadpis">Hra není uložená</h2>
      <button class="modalx" type="button" data-close data-i18n-aria="spol.zavrit" aria-label="Zavřít">×</button>
    </div>
    <div class="modalbody">
      <div class="msg" id="newtext"></div>
      <div class="newbtns">
        <button class="ghost arch" id="newsave" type="button" data-i18n="nova.ulozit">Uložit a začít novou</button>
        <button class="ghost bigbtn warn" id="newdrop" type="button" data-i18n="nova.bezulozeni">Začít novou bez uložení</button>
        <button class="ghost bigbtn" id="newback" type="button" data-i18n="spol.zpet">Zpět</button>
      </div>
    </div>
  </div>
</div>
