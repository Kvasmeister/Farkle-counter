<div class="setup" id="setup" hidden>
  <label class="goal"><span data-i18n="hra.hrajese">hraje se</span>
    <select id="modesel">
      <option value="points" selected data-i18n="hra.dobodu">do bodů</option>
      <option value="rounds" data-i18n="hra.nakola">na kola</option>
    </select>
    <select id="goalsel" data-i18n-aria="hra.cil.aria" aria-label="cíl hry">
      <option value="2000" data-i18n="hra.cil2000">2 000</option>
      <option value="4000" selected data-i18n="hra.cil4000">4 000</option>
      <option value="6000" data-i18n="hra.cil6000">6 000</option>
      <option value="8000" data-i18n="hra.cil8000">8 000</option>
      <option value="10000" data-i18n="hra.cil10000">10 000</option>
      <option value="custom" data-i18n="hra.vlastni">vlastní…</option>
    </select>
    <input id="goalnum" type="number" inputmode="numeric" min="100" step="100" hidden data-i18n-aria="hra.cilvlastni.aria" aria-label="vlastní cíl">
    <select id="roundsel" hidden data-i18n-aria="hra.limit.aria" aria-label="limit kol">
      <option value="none" selected data-i18n="hra.neomezene">neomezeně</option>
      <option value="custom" data-i18n="hra.vlastni">vlastní…</option>
    </select>
    <input id="roundnum" type="number" inputmode="numeric" min="1" step="1" hidden data-i18n-aria="hra.limitvlastni.aria" aria-label="vlastní limit kol">
